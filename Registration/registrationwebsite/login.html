<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form action="index.html" method="POST">
            <div class="input-group">
                <label for="username">Email</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
            <p class="signup-link">Don't have an account? <a href="index.html">Sign up</a></p>
        </form>
    </div>
</body>
</html>

<style>
   
    body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        background: url(img1.jpg) no-repeat center center/cover; /* Replace with your image */
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Transparent login container */
    .login-container {
        width: 400px;
        padding: 30px;
        background: rgba(0, 0, 0, 0.6); /* Semi-transparent black */
        border-radius: 15px;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        text-align: center;
        color: white;
    }

    .login-container h2 {
        margin-bottom: 20px;
        font-size: 28px;
    }

    .input-group {
        margin-bottom: 20px;
        text-align: left;
    }

    .input-group label {
        display: block;
        font-weight: 500;
    }

    .input-group input {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        font-size: 16px;
    }

    .input-group input::placeholder {
        color: rgba(255, 255, 255, 0.7);
    }

    .login-btn {
        width: 100%;
        padding: 12px;
        background-color: #f1683a;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .login-btn:hover {
        background-color: #ff7b50;
    }

    .signup-link {
        margin-top: 15px;
        font-size: 14px;
    }

    .signup-link a {
        color: #f1683a;
        font-weight: bold;
        text-decoration: none;
    }

    .signup-link a:hover {
        text-decoration: underline;
    }
</style>
