    <style>
         /* Loading Overlay Styles */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* Main Glasses Loading Animation */
        .glasses-loader {
            position: relative;
            width: 120px;
            height: 60px;
        }

        .glasses-frame {
            position: absolute;
            width: 100%;
            height: 100%;
            stroke: #0f766e;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .lens-left, .lens-right {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawLens 2s ease-in-out infinite;
        }

        .lens-right {
            animation-delay: 0.3s;
        }

        .bridge {
            stroke-dasharray: 20;
            stroke-dashoffset: 20;
            animation: drawBridge 1.5s ease-in-out infinite;
            animation-delay: 0.6s;
        }

        .temple-left, .temple-right {
            stroke-dasharray: 40;
            stroke-dashoffset: 40;
            animation: drawTemple 1.8s ease-in-out infinite;
        }

        .temple-right {
            animation-delay: 0.9s;
        }

        @keyframes drawLens {
            0%, 20% {
                stroke-dashoffset: 100;
                stroke: #0f766e;
            }
            50% {
                stroke-dashoffset: 0;
                stroke: #0891b2;
            }
            80%, 100% {
                stroke-dashoffset: 100;
                stroke: #0f766e;
            }
        }

        @keyframes drawBridge {
            0%, 30% {
                stroke-dashoffset: 20;
            }
            60% {
                stroke-dashoffset: 0;
            }
            90%, 100% {
                stroke-dashoffset: 20;
            }
        }

        @keyframes drawTemple {
            0%, 40% {
                stroke-dashoffset: 40;
            }
            70% {
                stroke-dashoffset: 0;
            }
            100% {
                stroke-dashoffset: 40;
            }
        }

        /* Loading Text */
        .loading-text {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: #0f766e;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            min-width: 200px;
        }

        .loading-dots {
            display: inline-block;
            width: 20px;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        .filter-group {

            gap: 0.5rem;

        .filter-group label {

        .filter-select {

            font-size: 0.9rem;

        .filter-select:focus {

            border-color: #0f766e;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .product-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);

        }

        .product-card:hover {

        .product-image {

            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-image img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.05);
        }

        .brand-logo {

            background: white;

            border-radius: 8px;
            border: 1px solid #e2e8f0;
            font-size: 0.8rem;

            color: #0f766e;

        .wishlist-btn {

            border: 1px solid #e2e8f0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .wishlist-btn:hover {
            background: #f8fafc;
            border-color: #0f766e;
            color: #0f766e;
        }

        .wishlist-btn.active {
            background: #0f766e;
            border-color: #0f766e;
            color: white;
        }

        .product-info {
            padding: 1.5rem;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .product-stats {

            align-items: center;
            gap: 1rem;
            margin-bottom: 0.8rem;
        }

        .sold-count {
            font-size: 0.9rem;
            color: #64748b;
        }

        .rating {
            display: flex;
            gap: 2px;
        }

        .star {
            width: 14px;
            height: 14px;
            background: #e2e8f0;
            border-radius: 2px;
            transition: background 0.3s ease;
        }

        .star.filled {
            background: #fbbf24;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0f766e;
            margin-bottom: 1rem;
        }

        .product-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {

            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;

                align-items: stretch;
            }

            }
            
            .products-grid {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 1.5rem;
            }
        }
    </style>
</head>

    <script>
        // Main loading system
        function showLoader() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.style.display = 'flex';
            setTimeout(() => {
                overlay.classList.remove('hidden');
            }, 10);
        }

        function hideLoader() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.add('hidden');
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 500);
        }

        // Add loading animation to all navigation links
        document.querySelectorAll('.nav-links a, .cta-buttons a').forEach(link => {
            link.addEventListener('click', function(e) {
                // Only trigger for actual navigation (not the current page)
                if (this.getAttribute('href') && !this.classList.contains('active')) {
                    e.preventDefault();
                    showLoader();
                    
                    // Simulate page loading (in a real site, this would be the actual page load)
                    setTimeout(() => {
                        
                        
                        // Hide loader after content is "loaded"
                        setTimeout(hideLoader, 500);
                    }, 1500);
                }
            });
        });

        // Smooth scrolling for anchor links
        document.querySelectorAll('.nav-links a, .cta-buttons a').forEach(link => {
            link.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                
                // Only show loading for actual navigation (not current page or anchors)
                if (href && href !== '#' && !this.classList.contains('active')) {
                    // Show loading animation
                    showLoader();
                    
                    // Allow normal navigation to proceed after short delay
                    setTimeout(() => {
                        window.location.href = href;
                    }, 1500);
                }
            });
        });

            sortProducts(products) {
                const sorted = [...products];
                
                switch(this.sortBy) {
                    case 'price-low':
                        return sorted.sort((a, b) => a.price - b.price);
                    case 'price-high':
                        return sorted.sort((a, b) => b.price - a.price);
                    case 'popularity':
                        return sorted.sort((a, b) => b.soldCount - a.soldCount);
                    case 'rating':
                        return sorted.sort((a, b) => b.rating - a.rating);
                    case 'newest':
                        return sorted.sort((a, b) => b.id - a.id);
                    default:
                        return sorted;
                }

            toggleWishlist(productId) {
                const index = this.wishlist.indexOf(productId);
                if (index > -1) {
                    this.wishlist.splice(index, 1);
                } else {
                    this.wishlist.push(productId);
                }
                this.renderProducts();
            }

            addToCart(productId) {
                const product = this.products.find(p => p.id === productId);
                if (product) {
                    // Add visual feedback
                    const btn = event.target;
                    const originalText = btn.textContent;
                    btn.textContent = 'Added!';
                    btn.style.background = 'linear-gradient(135deg, #059669, #0891b2)';
                    
                    setTimeout(() => {
                        btn.textContent = originalText;
                        btn.style.background = '';
                    }, 1500);
                    
                    // In a real app, you'd add to cart logic here
                    console.log(`Added ${product.name} to cart`);
                }
            }
        }

        // Global functions for pagination
        function changePage(direction) {
            if (direction === 'prev' && catalog.currentPage > 1) {
                catalog.currentPage--;
            } else if (direction === 'next') {
                catalog.currentPage++;
            }
            catalog.renderProducts();
            
            // Update pagination buttons
            document.querySelectorAll('.page-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelectorAll('.page-btn')[catalog.currentPage].classList.add('active');
        }

        // Initialize catalog
        let catalog;
        document.addEventListener('DOMContentLoaded', () => {
            catalog = new GlassesCatalog();
        });

        // Smooth scrolling for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
        });
    </script>
</body>
